[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-insumer"
version = "0.15.3"
description = "LangChain tools for InsumerAPI: condition-based access across 37 blockchains. Wallet trust profiles (155 base checks across 27 chains in 10 dimensions, up to 176 across 29 chains in 14), account code state (plain key, EIP-7702 delegation, contract), EAS attestations, Gitcoin Passport, Farcaster ID, compliance templates, ACP/UCP commerce, domain verification, merchant onboarding, USDC/USDT/BTC key purchase, and credit management. ECDSA-signed booleans, optional Merkle proofs, 26 tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "The Insumer Model", email = "support@insumermodel.com"},
]
keywords = [
    "langchain",
    "blockchain",
    "attestation",
    "on-chain-verification",
    "ecdsa",
    "web3",
    "privacy",
    "on-chain",
    "ai-agents",
    "condition-based-access",
    "token-gating",
    "nft-verification",
    "agent-trust",
    "merkle-proof",
    "eas-attestation",
    "compliance",
    "kyc",
    "acp",
    "ucp",
    "agentic-commerce",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "langchain-core>=0.2.17",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://insumermodel.com/developers/"
Documentation = "https://insumermodel.com/llms-full.txt"
Repository = "https://github.com/insumerapi/langchain-insumer"
"API Reference" = "https://insumermodel.com/openapi.yaml"
"Bug Tracker" = "https://github.com/insumerapi/langchain-insumer/issues"

[tool.setuptools.packages.find]
include = ["langchain_insumer*"]
